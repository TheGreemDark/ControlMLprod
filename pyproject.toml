[project]
name = "controlmlprod"
version = "0.1.0"
description = "Project for the AI Product Management course"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "boto3>=1.43.111",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "wandb>=0.31.0",
]

[dependency-groups]
dev = [
    "mypy==2.3.1",
    "pre-commit==4.6.2",
    "pytest>=9.1.1",
    "ruff==0.16.9",
]

[tool.ruff]
line-length = 99

[tool.ruff.lint]
extend-select = [
    "B",
    "UP",
    "I",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
strict = true
ignore_missing_imports = true
exclude = [
    "^\\.venv/",
    "^\\.git/",
    "^__pycache__/",
    "^\\.mypy_cache/",
    "^\\.ruff_cache/",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
