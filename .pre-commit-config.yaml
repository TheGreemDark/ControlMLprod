repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --locked ruff check .
        language: system
        pass_filenames: false

      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --check .
        language: system
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: uv run --locked mypy src
        language: system
        pass_filenames: false